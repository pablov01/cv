<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>CV Builder — Crea tu CV profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Source+Sans+3:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/editor.css?v=6">
    <link rel="stylesheet" href="css/cv.css?v=6">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-file-alt"></i> CV Builder</h1>
            </div>

            <nav class="sidebar-nav">
                <!-- Secciones disponibles -->
                <div class="nav-section">
                    <h3><i class="fas fa-layer-group"></i> Agregar secciones</h3>
                    <div id="available-sections" class="section-list"></div>
                </div>

                <!-- Secciones activas (orden) -->
                <div class="nav-section">
                    <h3><i class="fas fa-arrows-alt"></i> Secciones activas</h3>
                    <div id="active-sections" class="active-sections"></div>
                </div>

                <!-- Plantillas -->
                <div class="nav-section">
                    <h3><i class="fas fa-palette"></i> Plantilla</h3>
                    <div class="template-selector">
                        <button class="template-btn active" data-template="modern" onclick="editor.setTemplate('modern')">
                            <span class="template-preview" style="background:linear-gradient(to bottom,#8c4a2f 30%,#fbfaf7 30%);border-radius:3px;width:24px;height:30px;border:1px solid #475569"></span>
                            Moderna
                        </button>
                        <button class="template-btn" data-template="classic" onclick="editor.setTemplate('classic')">
                            <span class="template-preview" style="background:linear-gradient(to bottom,#1e293b 20%,#fff 20%);border-radius:3px;width:24px;height:30px;border:1px solid #475569"></span>
                            Clásica
                        </button>
                        <button class="template-btn" data-template="minimal" onclick="editor.setTemplate('minimal')">
                            <span class="template-preview" style="background:#fff;border-radius:3px;width:24px;height:30px;border:1px solid #475569"></span>
                            Mínima
                        </button>
                    </div>
                </div>

                <!-- Color -->
                <div class="nav-section">
                    <h3><i class="fas fa-paint-brush"></i> Color de acento</h3>
                    <div class="color-options">
                        <button class="color-btn active" style="background:#8c4a2f" onclick="editor.setColor('#8c4a2f')"></button>
                        <button class="color-btn" style="background:#2563eb" onclick="editor.setColor('#2563eb')"></button>
                        <button class="color-btn" style="background:#059669" onclick="editor.setColor('#059669')"></button>
                        <button class="color-btn" style="background:#dc2626" onclick="editor.setColor('#dc2626')"></button>
                        <button class="color-btn" style="background:#7c3aed" onclick="editor.setColor('#7c3aed')"></button>
                        <button class="color-btn" style="background:#0891b2" onclick="editor.setColor('#0891b2')"></button>
                        <button class="color-btn" style="background:#be185d" onclick="editor.setColor('#be185d')"></button>
                        <button class="color-btn" style="background:#1e293b" onclick="editor.setColor('#1e293b')"></button>
                    </div>
                </div>

                <!-- Exportar -->
                <div class="nav-section">
                    <h3><i class="fas fa-download"></i> Exportar</h3>
                    <div class="action-buttons">
                        <button class="action-btn primary" onclick="exportPDF()">
                            <i class="fas fa-file-pdf"></i> Exportar PDF
                        </button>
                        <button class="action-btn secondary" onclick="exportCanvasImage()">
                            <i class="fas fa-image"></i> Exportar para Canva
                        </button>
                        <button class="action-btn tertiary" onclick="saveToJSON()">
                            <i class="fas fa-save"></i> Guardar JSON
                        </button>
                        <button class="action-btn tertiary" onclick="document.getElementById('json-input').click()">
                            <i class="fas fa-folder-open"></i> Cargar JSON
                        </button>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- ===== MAIN ===== -->
        <main class="main-area">
            <div class="toolbar">
                <button class="toolbar-btn" onclick="editor.undo()" title="Deshacer">
                    <i class="fas fa-undo"></i>
                </button>
                <button class="toolbar-btn" onclick="editor.redo()" title="Rehacer">
                    <i class="fas fa-redo"></i>
                </button>
                <div class="toolbar-separator"></div>
                <button class="toolbar-btn" onclick="editor.zoomIn()" title="Acercar">
                    <i class="fas fa-search-plus"></i>
                </button>
                <button class="toolbar-btn" onclick="editor.zoomOut()" title="Alejar">
                    <i class="fas fa-search-minus"></i>
                </button>
                <span id="zoom-level" class="zoom-level">100%</span>
                <div class="toolbar-separator"></div>
                <button class="toolbar-btn" onclick="editor.resetCV()" title="Reiniciar">
                    <i class="fas fa-trash-alt"></i> Reiniciar
                </button>
            </div>

            <div class="cv-container">
                <div id="cv-wrapper">
                    <div id="cv-pages" class="cv-pages">
                        <!-- El CV se renderiza dinámicamente aquí, paginado en hojas A4 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de edición -->
    <div id="edit-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Editar</h3>
                <button class="modal-close" onclick="editor.closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="editor.closeModal()">Cancelar</button>
                <button class="btn btn-save" onclick="editor.saveModal()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Input JSON oculto -->
    <input type="file" id="json-input" accept=".json" style="display:none" onchange="handleJSONLoad(event)">

    <script src="js/data.js?v=6"></script>
    <script src="js/editor.js?v=6"></script>
    <script src="js/render.js?v=6"></script>
    <script src="js/export-pdf.js?v=6"></script>
    <script src="js/export-canvas.js?v=6"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
